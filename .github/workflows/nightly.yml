name: Nightly

on:
  push:
    branches: [master]

jobs:
  plugin:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: plugin
        run: ./gradlew build
      - name: Rename plugin JAR
        working-directory: plugin/build/libs
        run: mv autonomous-npc-plugin-*.jar autonomous-npc-plugin-nightly.jar
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-npc-plugin-nightly
          path: plugin/build/libs/autonomous-npc-plugin-nightly.jar
  release:
    name: Publish Nightly Release
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly autonomous-npc-plugin-nightly/autonomous-npc-plugin-nightly.jar --clobber
            gh release edit nightly --title "Nightly" --notes "Built from master @ ${{ github.sha }}" --prerelease
          else
            gh release create nightly --title "Nightly" --notes "Built from master @ ${{ github.sha }}" --prerelease autonomous-npc-plugin-nightly/autonomous-npc-plugin-nightly.jar
          fi
